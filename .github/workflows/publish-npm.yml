name: Publish to npm

# Manual publication: run it from the Actions tab with the version to publish. It publishes
# directly to npm through trusted publishing (OIDC, no token): npmjs.com must trust this
# repository and this workflow file for the package (package settings > Trusted Publisher).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json exactly"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install -g npm@latest
      - name: Confirm the requested version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: package.json is $PKG_VERSION, requested ${{ inputs.version }}" >&2
            exit 1
          fi
          echo "Publishing mwgp@$PKG_VERSION"
      - run: npm ci
      - name: Regenerate the single-file browser versions shipped in the package
        run: |
          npm run export:converter
          npm run export:studio
      - name: Publish with provenance
        run: npm publish --provenance

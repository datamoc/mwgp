name: Publish to npm

# Manual staging: run it from the Actions tab with the version to publish. It stages the
# version on npm through trusted publishing (OIDC, no token) with `npm stage publish`; nothing
# goes live until a maintainer approves it on npmjs.com (Staged versions) with MFA.
# npmjs.com must trust this repository and this workflow file, with staging allowed
# (Trusted Publisher > allow staged publish).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json exactly"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use the npm that has `npm stage` (12.2.0, tested)
        run: npm install -g npm@12.2.0
      - name: Confirm the requested version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: package.json is $PKG_VERSION, requested ${{ inputs.version }}" >&2
            exit 1
          fi
          echo "Publishing mwgp@$PKG_VERSION"
      - run: npm ci
      - name: Regenerate the single-file browser versions shipped in the package
        run: |
          npm run export:converter
          npm run export:studio
      - name: Stage the version on npm (goes live only after approval on npmjs.com)
        run: npm stage publish --provenance
      - name: Next step
        run: echo "Staged mwgp@${{ inputs.version }}. Approve it on https://www.npmjs.com/package/mwgp (Staged versions) with MFA."

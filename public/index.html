<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MWG Player</title>
<style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#10131b;color:#f4f6fb}body{max-width:980px;margin:0 auto;padding:48px 24px}h1{font-size:42px;margin:0 0 8px}p{color:#aeb6c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:32px}.card{background:#191e2a;border:1px solid #2e374a;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}.card h2{font-size:18px;margin:0;overflow-wrap:anywhere}.engine{font-size:12px;color:#8ea4d8;text-transform:uppercase;letter-spacing:.08em}button{border:0;border-radius:9px;background:#6f8cff;color:white;font-weight:700;padding:11px 14px;cursor:pointer;margin-top:auto}#status{margin-top:24px;color:#94a3b8}.empty{padding:24px;border:1px dashed #39445b;border-radius:12px}.card{position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--metal);box-shadow:0 0 18px var(--metal)}.card.metal-gold{--metal:#e8b84b;background:linear-gradient(145deg,#2a2415,#191e2a 58%);border-color:#8e7131}.card.metal-silver{--metal:#cbd5e1;background:linear-gradient(145deg,#252b35,#191e2a 58%);border-color:#68778c}.card.metal-copper{--metal:#c77b45;background:linear-gradient(145deg,#2a1e1a,#191e2a 58%);border-color:#79503b}.metal-badge{align-self:flex-start;color:var(--metal);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.mwg-brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mwg-powered{display:block;line-height:0}.mwg-powered svg{height:34px;width:auto;display:block}.mwg-support{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid currentColor;border-radius:8px;text-decoration:none;font-size:.9rem;white-space:nowrap;color:inherit}</style></head>
<body><h1>MWG Player</h1><p>Local catalog for playing RPG Maker games in browser using the MWG Framework.</p><div class="mwg-brand" style="margin:0 0 24px"><a class="mwg-powered" href="https://datamoc.github.io/mwg/" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 38" width="196" height="38" role="img" aria-label="powered by mwg"><rect width="196" height="38" rx="10" fill="#0b0e14"/><text x="12" y="23.5" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace" font-size="12.5" fill="#8b96a8">powered by</text><rect x="88" y="8" width="22" height="22" rx="3" fill="#0057b7"/><rect x="114" y="8" width="22" height="22" rx="3" fill="#ffd700"/><text x="166" y="26" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace" font-size="26" font-weight="700" letter-spacing="0.5" fill="#eef1f6" text-anchor="middle" textLength="46" lengthAdjust="spacingAndGlyphs">mwg</text></svg></a><a class="mwg-support" href="https://buy.stripe.com/bJe8wOeUq4oZ2kXfyeaIM00" target="_blank" rel="noopener noreferrer">♥ Support the project</a></div><section id="games" class="grid"></section><div id="status">Scanning projects…</div>
<p><a href="converter.html" style="color:#e8b84b">Convert a game in your browser (no Node required)</a></p>
<script>const list=document.querySelector('#games'),status=document.querySelector('#status');
function metalFor(game){if(game.kind==='mwgp'||game.kind==='web')return 'gold';if(game.kind==='mv')return 'silver';return 'copper';}
function playButton(g){if(g.kind==='web')return '<button data-web-id="'+g.id+'">Play (web)</button>';if(g.kind==='mwgp')return '<div style="display:flex;gap:8px;margin-top:auto"><button data-mwgp-id="'+g.id+'" style="flex:1">Play MWGP</button><button data-studio-id="'+g.id+'" style="flex:1;background:#b78343;border:1px solid #e0bd7d" title="Éditer le jeu dans MWGP Studio">Studio</button></div>'+(g.stale?' <span title="Converted by an older converter ('+(g.converterVersion||'before 0.2.0')+'): some commands may play wrong. Reconvert with npm run convert:auto -- --stale" style="color:#f2d9a4">⚠ reconvert</span>':'');return '<button data-id="'+g.id+'">Play native</button>';}
function metalLabel(metal){return metal.charAt(0).toUpperCase()+metal.slice(1);}
async function load(){const catalog=await fetch('/api/games').then(r=>r.json());const games=[...catalog.mwgp.map(g=>({...g,engine:g.engine||'MWGP / mwg'})),...catalog.rpgm];list.innerHTML=games.length?games.map(g=>{const metal=metalFor(g);return '<article class="card metal-'+metal+'"><div class="metal-badge">'+metalLabel(metal)+'</div><div class="engine">'+escapeHtml(g.engine)+'</div><h2>'+escapeHtml(g.name)+'</h2>'+playButton(g)+'</article>';}).join(''):'<div class="empty">No project found.</div>';status.textContent=games.length+' project'+(games.length===1?'':'s')+' found';
list.querySelectorAll('button[data-web-id]').forEach(button=>button.onclick=()=>{location.href='/web/'+encodeURIComponent(button.dataset.webId)+'/';});
list.querySelectorAll('button[data-mwgp-id]').forEach(button=>button.onclick=()=>{location.href='/player.html?id='+encodeURIComponent(button.dataset.mwgpId);});
list.querySelectorAll('button[data-studio-id]').forEach(button=>button.onclick=()=>{location.href='/studio.html?id='+encodeURIComponent(button.dataset.studioId);});
list.querySelectorAll('button[data-id]').forEach(button=>button.onclick=async()=>{button.disabled=true;const result=await fetch('/api/launch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:button.dataset.id})}).then(r=>r.json());status.textContent=result.ok?'Started '+result.name:result.error;button.disabled=false;});}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}load().catch(()=>status.textContent='Could not scan the games folder.');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MWGP Player</title><style>body{margin:0;background:#080d16;color:#f4f6fb;font:14px system-ui;display:grid;place-items:center;min-height:100vh}main{width:calc(100% - 32px)}h1{font:600 20px Georgia,serif;letter-spacing:.02em}#stage{position:relative;width:816px;height:624px;transform-origin:0 0;background:#000}#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated}p{color:#aeb6c8}.mwgp-loading{display:grid;gap:10px;place-items:center;min-height:80px;padding:18px;color:#d9c39a;font:15px Georgia,serif}.mwgp-loading:before{content:"";width:22px;height:22px;border:2px solid #384d63;border-top-color:#d2a35b;border-radius:50%;animation:mwgp-spin 1s linear infinite}@keyframes mwgp-spin{to{transform:rotate(360deg)}}.mwgp-title{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:1fr auto;background:#080d16;color:#f7f2e8;overflow:auto}.mwgp-title-art{position:absolute;inset:0;background:center/cover no-repeat;filter:saturate(.82) brightness(.62);opacity:.78}.mwgp-title-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,22,.92),rgba(8,13,22,.18) 55%,rgba(8,13,22,.78)),linear-gradient(0deg,rgba(8,13,22,.96),transparent 42%)}.mwgp-title-content{position:relative;align-self:center;width:min(760px,calc(100% - 64px));margin:0 auto}.mwgp-title-kicker{margin:0 0 14px;color:#d2a35b;font:12px system-ui;letter-spacing:.18em;text-transform:uppercase}.mwgp-title-name{margin:0;max-width:680px;font:600 clamp(38px,7vw,86px)/.96 Georgia,serif;letter-spacing:-.035em;text-shadow:0 4px 22px #000}.mwgp-title-sub{margin:18px 0 0;max-width:470px;color:#c2cbd7;font:15px/1.6 system-ui}.mwgp-title-menu{position:relative;display:flex;gap:10px;align-items:center;justify-content:center;padding:22px 18px 26px;background:rgba(7,11,18,.86);border-top:1px solid rgba(210,163,91,.38)}.mwgp-title-menu button{min-width:150px;padding:12px 18px;border:1px solid #506176;background:#121d2b;color:#eef1f4;font:600 14px system-ui;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}.mwgp-title-menu button:hover,.mwgp-title-menu button:focus-visible{background:#21344a;border-color:#d2a35b;outline:none;transform:translateY(-2px)}.mwgp-title-menu button[data-primary=true]{background:#b78343;border-color:#e0bd7d;color:#10131b}.mwgp-title-note{position:absolute;right:18px;bottom:7px;margin:0;color:#8998aa;font-size:11px}.mwgp-options{position:absolute;right:18px;bottom:54px;max-width:260px;padding:10px 12px;border:1px solid #506176;background:#101b29;color:#cbd5df;font-size:12px}.mwgp-title[hidden]{display:none}@media(max-width:620px){.mwgp-title-content{width:calc(100% - 36px)}.mwgp-title-menu{flex-wrap:wrap}.mwgp-title-menu button{min-width:130px}.mwgp-title-note{position:static;width:100%;text-align:center;margin-top:6px}}.mwg-brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mwg-powered{display:block;line-height:0}.mwg-powered svg{height:34px;width:auto;display:block}.mwg-support{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid currentColor;border-radius:8px;text-decoration:none;font-size:.9rem;white-space:nowrap;color:inherit}
</style></head><body><main><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h1 id="title" style="margin:0">MWGP Player</h1><a id="studio-btn" href="#" style="background:#b78343;border:1px solid #e0bd7d;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;font-weight:600;font-size:13px;display:none">Edit in Studio</a><div class="mwg-brand"><a class="mwg-powered" href="https://datamoc.github.io/mwg/" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 38" width="196" height="38" role="img" aria-label="powered by mwg"><rect width="196" height="38" rx="10" fill="#0b0e14"/><text x="12" y="23.5" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace" font-size="12.5" fill="#8b96a8">powered by</text><rect x="88" y="8" width="22" height="22" rx="3" fill="#0057b7"/><rect x="114" y="8" width="22" height="22" rx="3" fill="#ffd700"/><text x="166" y="26" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,monospace" font-size="26" font-weight="700" letter-spacing="0.5" fill="#eef1f6" text-anchor="middle" textLength="46" lengthAdjust="spacingAndGlyphs">mwg</text></svg></a><a class="mwg-support" href="https://buy.stripe.com/bJe8wOeUq4oZ2kXfyeaIM00" target="_blank" rel="noopener noreferrer">♥ Support the project</a></div></div><p>Arrow keys / WASD to move. Enter or Space advances dialogue.</p><div id="stage"><canvas id="game"></canvas></div></main><script type="module" src="/player.js"></script></body></html>
